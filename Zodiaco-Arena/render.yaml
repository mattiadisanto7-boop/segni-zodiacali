services:
  - type: web
    name: zodiaco-arena
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: ZODIAC_ROUND_MS
        value: 60000
      - key: ZODIAC_PROGRESSIVE_REVEAL_MS
        value: 30000
